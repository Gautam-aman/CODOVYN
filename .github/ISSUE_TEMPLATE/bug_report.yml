name: Bug report
description: Report a reproducible CODOVYN defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities use SECURITY.md and private reporting. Never attach auth files, device codes, private source or raw task databases."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior without secrets.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands and a small public example if possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and relevant CLI version.
