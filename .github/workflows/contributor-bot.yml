name: Contributor bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

# Share the repository lock with the other community bots so claims across
# different issues cannot race the two-open-issue assignment limit.
concurrency:
  group: community-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      vars.COMMUNITY_BOTS_ENABLED == 'true' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      github.event.issue.state == 'open'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # issue_comment runs from the default branch. Explicitly check out only
      # that trusted branch; contributor comment text is never workflow code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Respond to issue comment
        env:
          COMMUNITY_BOTS_ENABLED: ${{ vars.COMMUNITY_BOTS_ENABLED || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/contributor-bot.mjs
