name: PR assignment advisory

"on":
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, labeled, unlabeled]
  issues:
    types: [assigned, unassigned]

permissions:
  contents: read
  issues: write
  # PR metadata and assignment advisory comments/labels only.
  pull-requests: write

concurrency:
  group: community-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      vars.COMMUNITY_BOTS_ENABLED == 'true' &&
      ((github.event.pull_request != null && github.event.pull_request.state == 'open') ||
      (github.event.issue != null && (github.event.action == 'assigned' || github.event.action == 'unassigned')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target has write access. Only this trusted default-branch
      # script is checked out and executed; PR head code is never fetched.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.12.1'
      - name: Reconcile PR assignment advisory
        env:
          COMMUNITY_BOTS_ENABLED: ${{ vars.COMMUNITY_BOTS_ENABLED || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GUARDIAN_BOT_LOGIN: ${{ vars.GUARDIAN_BOT_LOGIN || 'github-actions[bot]' }}
        run: node .github/scripts/pr-assignment-bot.mjs
